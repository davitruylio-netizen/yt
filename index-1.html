<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE MAST [3D] — Carregando</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12;color:#fff;font-family:Arial,sans-serif}
    main{width:min(90%,520px);text-align:center;padding:32px}
    h1{font-size:clamp(28px,6vw,44px);letter-spacing:2px;margin:0 0 12px}
    p{color:#aab4c5;line-height:1.5}
    .track{height:10px;background:#202938;border-radius:20px;overflow:hidden;margin:26px 0 12px}
    #bar{height:100%;width:0;background:#45d483;transition:width .2s}
    #status{font-size:14px;color:#d7deea}
  </style>
</head>
<body>
<main>
  <h1>THE MAST [3D]</h1>
  <p>Preparando o jogo. Isso pode levar alguns instantes.</p>
  <div class="track"><div id="bar"></div></div>
  <div id="status">Carregando arquivos…</div>
</main>
<script>
(async function () {
  const files = ["jogo-parte-1.bin", "jogo-parte-2.bin", "jogo-parte-3.bin"];
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  try {
    const chunks = [];
    let total = 0;
    for (let i = 0; i < files.length; i++) {
      status.textContent = `Baixando parte ${i + 1} de ${files.length}…`;
      const response = await fetch(files[i], {cache: "no-store"});
      if (!response.ok) throw new Error(`Não foi possível carregar ${files[i]} (HTTP ${response.status}).`);
      const data = await response.arrayBuffer();
      chunks.push(new Uint8Array(data));
      total += data.byteLength;
      bar.style.width = `${Math.round(((i + 1) / files.length) * 100)}%`;
    }
    status.textContent = "Montando o jogo…";
    const combined = new Uint8Array(total);
    let offset = 0;
    for (const chunk of chunks) {
      combined.set(chunk, offset);
      offset += chunk.byteLength;
    }
    const html = new TextDecoder("utf-8").decode(combined);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    status.textContent = "Erro ao carregar o jogo: " + error.message;
    status.style.color = "#ff8b8b";
  }
})();
</script>
</body>
</html>
