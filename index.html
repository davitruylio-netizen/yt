<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Portal de Vídeos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .video-container {
      width: 100%;
      max-width: 800px;
      margin-bottom: 30px;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
    }

    /* Torna o vídeo responsivo para celulares e PCs */
    .responsive-iframe {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Proporção 16:9 */
    }

    .responsive-iframe iframe, 
    .responsive-iframe video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Meu Player de Vídeos</h1>

  <!-- Opção A: Vídeo do YouTube (sem sair do site) -->
  <div class="video-container">
    <h2>Vídeo via YouTube Embed</h2>
    <div class="responsive-iframe">
      <!-- Substitua o ID 'dQw4w9WgXcQ' pelo ID do seu vídeo do YouTube -->
      <iframe 
        src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- Opção B: Vídeo local (.mp4) na mesma pasta -->
  <div class="video-container">
    <h2>Vídeo do próprio repositório</h2>
    <div class="responsive-iframe">
      <!-- Substitua 'seu-video.mp4' pelo arquivo presente na pasta do repositório -->
      <video controls>
        <source src="seu-video.mp4" type="video/mp4">
        Seu navegador não suporta a tag de vídeo.
      </video>
    </div>
  </div>

</body>
</html>
