
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRBEAST HUB</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:white;font-family:Arial,sans-serif}
header{
  height:65px;background:#111;display:flex;align-items:center;
  padding:0 22px;gap:22px;position:sticky;top:0;z-index:10;
  border-bottom:1px solid #252525
}
.logo{font-size:22px;font-weight:900;white-space:nowrap}
.logo span{color:#3185ff}
.menu{font-size:25px;cursor:pointer}
.search{display:flex;max-width:650px;flex:1;margin:auto}
.search input{
  width:100%;background:#202020;border:1px solid #383838;
  padding:12px 16px;color:white;border-radius:25px 0 0 25px;
  outline:none;font-size:15px
}
.search button{
  background:#303030;border:1px solid #383838;color:white;
  padding:0 22px;border-radius:0 25px 25px 0;cursor:pointer
}
.profile{background:#286cff;padding:10px 14px;border-radius:50%;font-weight:bold}
.layout{display:flex}
.sidebar{
  width:220px;padding:20px 12px;position:fixed;top:65px;bottom:0;
  background:#111;overflow:auto;transition:.2s
}
.sidebar.hidden{transform:translateX(-100%)}
.side-item{
  padding:14px;border-radius:10px;cursor:pointer;color:#ddd;
  margin-bottom:5px
}
.side-item:hover,.side-item.active{background:#292929;color:white}
main{margin-left:220px;padding:24px;width:calc(100% - 220px);transition:.2s}
main.expanded{margin-left:0;width:100%}
.categories{display:flex;gap:10px;overflow:auto;padding-bottom:20px}
.category{
  border:0;background:#292929;color:white;padding:10px 17px;
  border-radius:9px;white-space:nowrap;cursor:pointer
}
.category.active{background:white;color:black}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
  gap:25px 17px
}
.video{cursor:pointer;min-width:0}
.thumb{
  width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:13px;
  background:#222;transition:.2s
}
.video:hover .thumb{border-radius:7px;transform:scale(1.015)}
.info{display:flex;gap:11px;padding-top:11px}
.avatar{
  width:37px;height:37px;min-width:37px;border-radius:50%;
  background:#286cff;display:grid;place-items:center;font-weight:bold
}
.video-title{font-size:15px;font-weight:bold;line-height:1.4}
.channel,.views{font-size:13px;color:#aaa;margin-top:5px}
#playerScreen{
  display:none;position:fixed;inset:0;background:#0f0f0f;
  z-index:20;overflow:auto;padding:20px
}
.player-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.close{
  background:#292929;border:0;color:white;padding:11px 18px;
  border-radius:8px;cursor:pointer;font-size:15px
}
.player-container{max-width:1050px;margin:auto}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.player-title{font-size:22px;margin-top:18px}
.player-channel{color:#aaa;margin-top:10px}
.empty{color:#aaa;text-align:center;padding:60px 10px;grid-column:1/-1}
footer{text-align:center;color:#666;padding:40px;font-size:12px}
@media(max-width:700px){
 header{padding:0 12px;gap:10px}
 .logo{font-size:17px}
 .sidebar{width:190px}
 main{margin-left:0;width:100%;padding:15px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}
 .video-title{font-size:13px}
 .avatar{width:30px;height:30px;min-width:30px}
 .info{gap:7px}
 .search input{min-width:0}
 .search button{padding:0 13px}
 .profile{display:none}
}
@media(max-width:380px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="menu" onclick="toggleMenu()">☰</div>
  <div class="logo">MRBEAST <span>HUB</span></div>
  <div class="search">
    <input id="searchInput" placeholder="Pesquisar vídeos ou criadores..."
      oninput="renderVideos()">
    <button onclick="renderVideos()">⌕</button>
  </div>
  <div class="profile">M</div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-item active" onclick="setCategory('Todos',this)">⌂ &nbsp; Início</div>
    <div class="side-item" onclick="setCategory('Entretenimento',this)">▶ &nbsp; Entretenimento</div>
    <div class="side-item" onclick="setCategory('Games',this)">🎮 &nbsp; Games</div>
    <div class="side-item" onclick="setCategory('Desafios',this)">🔥 &nbsp; Desafios</div>
    <div class="side-item" onclick="setCategory('Esportes',this)">⚽ &nbsp; Esportes</div>
    <div class="side-item" onclick="setCategory('Tecnologia',this)">💻 &nbsp; Tecnologia</div>
  </aside>

  <main id="main">
    <div class="categories">
      <button class="category active" onclick="setCategory('Todos',this)">Todos</button>
      <button class="category" onclick="setCategory('Entretenimento',this)">Entretenimento</button>
      <button class="category" onclick="setCategory('Games',this)">Games</button>
      <button class="category" onclick="setCategory('Desafios',this)">Desafios</button>
      <button class="category" onclick="setCategory('Esportes',this)">Esportes</button>
      <button class="category" onclick="setCategory('Tecnologia',this)">Tecnologia</button>
    </div>

    <div class="grid" id="videoGrid"></div>
    <footer>MRBEAST HUB • Sua plataforma de vídeos</footer>
  </main>
</div>

<div id="playerScreen">
  <div class="player-top">
    <div class="logo">MRBEAST <span>HUB</span></div>
    <button class="close" onclick="closePlayer()">✕ Voltar ao feed</button>
  </div>
  <div class="player-container">
    <iframe id="videoPlayer" allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
    </iframe>
    <h2 class="player-title" id="playerTitle"></h2>
    <div class="player-channel" id="playerChannel"></div>
  </div>
</div>

<script>
// CADASTRO DOS VÍDEOS
// Para adicionar um vídeo, copie um item e altere suas informações.
// O ID é a parte depois de v= no endereço do YouTube.

const videos = [
  {
    id:"M7lc1UVf-VE",
    title:"Demonstração do player do YouTube",
    channel:"YouTube",
    category:"Tecnologia",
    views:"Vídeo de demonstração",
    avatar:"Y"
  },
  {
    id:"aqz-KE-bpKQ",
    title:"Big Buck Bunny - Animação",
    channel:"Blender",
    category:"Entretenimento",
    views:"Vídeo de animação",
    avatar:"B"
  },
  {
    id:"ScMzIvxBSi4",
    title:"Vídeo de demonstração",
    channel:"YouTube",
    category:"Entretenimento",
    views:"Vídeo de demonstração",
    avatar:"Y"
  }
];

let selectedCategory="Todos";

function renderVideos(){
  const query=document.getElementById("searchInput").value
    .toLowerCase().trim();

  const filtered=videos.filter(video=>{
    const matchesCategory=selectedCategory==="Todos" ||
      video.category===selectedCategory;
    const matchesSearch=
      video.title.toLowerCase().includes(query) ||
      video.channel.toLowerCase().includes(query) ||
      video.category.toLowerCase().includes(query);

    return matchesCategory && matchesSearch;
  });

  const grid=document.getElementById("videoGrid");
  grid.innerHTML="";

  if(filtered.length===0){
    grid.innerHTML='<div class="empty">Nenhum vídeo encontrado no nosso catálogo.<br><br>Experimente outro nome.</div>';
    return;
  }

  filtered.forEach(video=>{
    const card=document.createElement("article");
    card.className="video";
    card.innerHTML=`
      <img class="thumb"
        src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
        alt="">
      <div class="info">
        <div class="avatar">${video.avatar}</div>
        <div>
          <div class="video-title">${escapeHTML(video.title)}</div>
          <div class="channel">${escapeHTML(video.channel)}</div>
          <div class="views">${escapeHTML(video.views)}</div>
        </div>
      </div>
    `;
    card.addEventListener("click",()=>openPlayer(video));
    grid.appendChild(card);
  });
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[char]);
}

function openPlayer(video){
  document.getElementById("playerScreen").style.display="block";
  document.getElementById("videoPlayer").src=
    "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(video.id)+"?autoplay=1";
  document.getElementById("playerTitle").textContent=video.title;
  document.getElementById("playerChannel").textContent=video.channel;
  window.scrollTo(0,0);
}

function closePlayer(){
  document.getElementById("playerScreen").style.display="none";
  document.getElementById("videoPlayer").src="";
}

function setCategory(category,element){
  selectedCategory=category;
  document.querySelectorAll(".category").forEach(item=>
    item.classList.remove("active"));
  document.querySelectorAll(".side-item").forEach(item=>
    item.classList.remove("active"));
  if(element) element.classList.add("active");
  renderVideos();
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("hidden");
  document.getElementById("main").classList.toggle("expanded");
}

renderVideos();
</script>

</body>
</html>
