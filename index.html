
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRBEAST HUB</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #080b12;
    --panel: #101522;
    --panel2: #151d2d;
    --blue: #247bff;
    --text: #f4f7ff;
    --muted: #929db2;
    --border: #202a3d;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    height: 72px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: rgba(8,11,18,.94);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 0 28px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -1px;
    white-space: nowrap;
}

.logo span {
    color: var(--blue);
}

.search {
    flex: 1;
    max-width: 650px;
    margin: auto;
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
}

.search input {
    width: 100%;
    padding: 14px 17px;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
}

.search button {
    border: 0;
    padding: 0 20px;
    background: var(--blue);
    color: white;
    font-weight: bold;
}

.layout {
    display: flex;
    padding-top: 72px;
}

.sidebar {
    width: 235px;
    position: fixed;
    top: 72px;
    bottom: 0;
    left: 0;
    background: #0c111c;
    border-right: 1px solid var(--border);
    padding: 24px 14px;
    overflow-y: auto;
}

.side-title {
    color: var(--muted);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.5px;
    margin: 20px 12px 12px;
}

.nav-btn {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #b8c2d4;
    text-align: left;
    margin-bottom: 4px;
    transition: .2s;
}

.nav-btn:hover,
.nav-btn.active {
    background: #17243b;
    color: white;
}

.nav-btn.active {
    border-left: 3px solid var(--blue);
}

.creator-mini {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    width: 100%;
    background: transparent;
    border: 0;
    color: #c4ccda;
    text-align: left;
    border-radius: 8px;
}

.creator-mini:hover {
    background: var(--panel2);
    color: white;
}

.avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #164b9a, #298cff);
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: bold;
    flex-shrink: 0;
}

.main {
    width: calc(100% - 235px);
    margin-left: 235px;
    padding: 30px;
    min-height: calc(100vh - 72px);
}

.hero {
    min-height: 260px;
    border-radius: 20px;
    padding: 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background:
        radial-gradient(circle at 80% 20%, rgba(36,123,255,.35), transparent 35%),
        linear-gradient(115deg, #101b30, #0d1220 65%, #132b4e);
    border: 1px solid #20395e;
    overflow: hidden;
    position: relative;
}

.hero::after {
    content: "HUB";
    position: absolute;
    right: 35px;
    bottom: -30px;
    font-size: 150px;
    font-weight: 900;
    color: rgba(255,255,255,.035);
    pointer-events: none;
}

.hero-tag {
    color: #76adff;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.hero h1 {
    font-size: clamp(30px, 5vw, 48px);
    margin-bottom: 12px;
    max-width: 650px;
}

.hero p {
    color: #b5c4dc;
    max-width: 500px;
    line-height: 1.6;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin: 34px 0 18px;
}

.section-head h2 {
    font-size: 21px;
}

.section-head span {
    color: var(--muted);
    font-size: 13px;
}

.creators {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 13px;
}

.creator-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 18px 12px;
    text-align: center;
    transition: .2s;
    cursor: pointer;
}

.creator-card:hover {
    transform: translateY(-4px);
    border-color: var(--blue);
    background: #142039;
}

.creator-avatar {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #124d9f, #348bff);
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 5px 22px #1764c344;
}

.creator-card h3 {
    font-size: 14px;
    margin-bottom: 6px;
}

.creator-card p {
    color: var(--muted);
    font-size: 11px;
}

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 5px;
    margin-bottom: 18px;
}

.filter {
    border: 1px solid var(--border);
    background: var(--panel);
    color: #c1ccdd;
    padding: 9px 15px;
    border-radius: 20px;
    white-space: nowrap;
    font-size: 12px;
}

.filter.active,
.filter:hover {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 22px 17px;
}

.video-card {
    min-width: 0;
    cursor: pointer;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    background: #141d2c;
    position: relative;
    border: 1px solid var(--border);
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .3s;
}

.video-card:hover .thumbnail img {
    transform: scale(1.06);
}

.play-icon {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(0,0,0,.1);
    opacity: 0;
    transition: .2s;
    font-size: 40px;
}

.video-card:hover .play-icon {
    opacity: 1;
}

.video-info {
    display: flex;
    gap: 11px;
    padding-top: 11px;
}

.video-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #174b91;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: bold;
}

.video-title {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 7px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.video-meta {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
}

.status {
    color: var(--muted);
    font-size: 13px;
    padding: 25px 0;
}

.load-more {
    display: block;
    margin: 30px auto;
    padding: 12px 24px;
    border-radius: 9px;
    border: 1px solid #285da5;
    background: #142a4a;
    color: white;
}

.load-more:hover {
    background: var(--blue);
}

.channel-header {
    background: linear-gradient(120deg, #122544, #101522);
    border: 1px solid var(--border);
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.channel-header .creator-avatar {
    margin: 0;
    flex-shrink: 0;
}

.channel-header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 7px;
}

.channel-link {
    margin-left: auto;
    color: white;
    background: var(--blue);
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.92);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.open {
    display: flex;
}

.player-box {
    width: min(100%, 1050px);
    background: #101522;
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
}

.player-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    gap: 15px;
}

.player-top h3 {
    font-size: 14px;
}

.close-player {
    background: transparent;
    color: white;
    border: 0;
    font-size: 27px;
}

.player-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    display: block;
    background: black;
}

.empty {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 25px;
    color: var(--muted);
    line-height: 1.6;
}

.hidden {
    display: none !important;
}

@media(max-width: 850px) {
    .sidebar {
        width: 68px;
        padding: 18px 8px;
    }

    .side-title,
    .nav-btn span,
    .creator-mini span:last-child {
        display: none;
    }

    .nav-btn {
        justify-content: center;
        font-size: 19px;
    }

    .creator-mini {
        justify-content: center;
        padding: 8px 0;
    }

    .main {
        margin-left: 68px;
        width: calc(100% - 68px);
        padding: 20px;
    }

    .header {
        padding: 0 14px;
        gap: 12px;
    }

    .logo {
        font-size: 17px;
    }
}

@media(max-width: 550px) {
    .header {
        height: 62px;
    }

    .layout {
        padding-top: 62px;
    }

    .sidebar {
        top: 62px;
    }

    .main {
        padding: 14px;
    }

    .hero {
        padding: 23px;
        min-height: 220px;
    }

    .hero::after {
        font-size: 90px;
    }

    .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 17px 10px;
    }

    .video-title {
        font-size: 12px;
    }

    .video-meta {
        font-size: 10px;
    }

    .video-avatar {
        width: 28px;
        height: 28px;
    }

    .creators {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
    }

    .creator-card {
        padding: 13px 5px;
    }

    .creator-avatar {
        width: 48px;
        height: 48px;
        font-size: 16px;
    }

    .creator-card h3 {
        font-size: 11px;
    }

    .creator-card p {
        font-size: 9px;
    }

    .channel-header {
        flex-wrap: wrap;
    }

    .channel-link {
        margin-left: 0;
    }

    .search input {
        padding: 11px;
        min-width: 0;
    }

    .search button {
        padding: 0 12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">MRBEAST <span>HUB</span></div>

    <div class="search">
        <input id="searchInput" type="text"
               placeholder="Pesquisar vídeos ou criadores...">
        <button id="searchButton">⌕</button>
    </div>
</header>

<div class="layout">

<aside class="sidebar">

    <button class="nav-btn active" data-page="home">
        <span>⌂</span><span>Início</span>
    </button>

    <button class="nav-btn" data-page="videos">
        <span>▶</span><span>Vídeos</span>
    </button>

    <button class="nav-btn" data-page="creators">
        <span>♙</span><span>Criadores</span>
    </button>

    <div class="side-title">SEUS CRIADORES</div>

    <div id="sidebarCreators"></div>

</aside>

<main class="main">

    <section id="homePage">

        <div class="hero">
            <div class="hero-tag">SEU UNIVERSO DE VÍDEOS</div>
            <h1>Todos os seus criadores em um só lugar.</h1>
            <p>
                Explore vídeos, descubra criadores e assista
                diretamente pelo MRBEAST HUB.
            </p>
        </div>

        <div class="section-head">
            <h2>Seus criadores</h2>
            <span>6 canais</span>
        </div>

        <div class="creators" id="homeCreators"></div>

        <div class="section-head">
            <h2>Vídeos recentes</h2>
            <span id="videoCount">Carregando...</span>
        </div>

        <div class="filters" id="filters"></div>

        <div class="video-grid" id="videoGrid"></div>

        <div class="status" id="status">
            Buscando vídeos dos seus criadores...
        </div>

        <button class="load-more hidden" id="loadMore">
            Carregar mais vídeos
        </button>

    </section>

    <section id="channelPage" class="hidden">
        <div id="channelHeader"></div>

        <div class="section-head">
            <h2>Vídeos do canal</h2>
        </div>

        <div class="video-grid" id="channelGrid"></div>

        <div class="status" id="channelStatus"></div>

        <button class="load-more hidden" id="channelLoadMore">
            Carregar mais
        </button>
    </section>

</main>
</div>

<div class="modal" id="playerModal">
    <div class="player-box">
        <div class="player-top">
            <h3 id="playerTitle">Assistindo vídeo</h3>
            <button class="close-player" id="closePlayer">×</button>
        </div>

        <iframe
            id="playerFrame"
            class="player-frame"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>
</div>

<script>
/* ==========================================
   CONFIGURAÇÃO DOS CRIADORES
========================================== */

const creators = [
    {
        name: "MrBeast",
        handle: "@MrBeast",
        id: "UCX6OQ3DkcsbYNE6H8uQQuVA",
        initials: "MB",
        category: "Entretenimento"
    },
    {
        name: "Jazzghost",
        handle: "@jazzghost",
        id: "UCIXguhHCl8eDTkXpEuiGPUA",
        initials: "JG",
        category: "Games"
    },
    {
        name: "Geleia",
        handle: "@geleia0",
        id: "UCEfGV5hx2VrXl4jOUnG0MRQ",
        initials: "GE",
        category: "Games"
    },
    {
        name: "Ciência Todo Dia",
        handle: "@CienciaTodoDia",
        id: "UCn9Erjy00mpnWeLnRqhsA1g",
        initials: "CT",
        category: "Ciência"
    },
    {
        name: "Derponce",
        handle: "@derponce",
        id: "UCFhZHkxjgParANyn4L6nTrg",
        initials: "DE",
        category: "Games"
    },
    {
        name: "BlackoutZ",
        handle: "@blackoutzoficial",
        id: "UCltmTYqOHriItyMXg8f0anQ",
        initials: "BZ",
        category: "Games"
    }
];

/* ==========================================
   INSTÂNCIAS PÚBLICAS
========================================== */

const instances = [
    "https://inv.nadeko.net",
    "https://invidious.nerdvpn.de",
    "https://invidious.tiekoetter.com",
    "https://yt.chocolatemoo53.com"
];

/* ==========================================
   ESTADO DO SITE
========================================== */

let allVideos = [];
let currentCreator = null;
let currentFilter = "Todos";
let homePage = 1;
let channelPageNumber = 1;
let currentChannelVideos = [];
let currentInstanceIndex = 0;
let loading = false;

const videoGrid = document.getElementById("videoGrid");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("searchInput");

/* ==========================================
   ELEMENTOS DOS CRIADORES
========================================== */

function renderCreators() {
    const home = document.getElementById("homeCreators");
    const sidebar = document.getElementById("sidebarCreators");

    home.innerHTML = "";
    sidebar.innerHTML = "";

    creators.forEach(creator => {

        const card = document.createElement("div");
        card.className = "creator-card";

        card.innerHTML = `
            <div class="creator-avatar">${creator.initials}</div>
            <h3>${creator.name}</h3>
            <p>${creator.category}</p>
        `;

        card.addEventListener("click", () => openChannel(creator));
        home.appendChild(card);

        const mini = document.createElement("button");
        mini.className = "creator-mini";

        mini.innerHTML = `
            <span class="avatar">${creator.initials}</span>
            <span>${creator.name}</span>
        `;

        mini.addEventListener("click", () => openChannel(creator));
        sidebar.appendChild(mini);
    });
}

/* ==========================================
   BUSCAR VÍDEOS SEM API KEY
========================================== */

async function fetchWithTimeout(url, timeout = 9000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);

    try {
        const response = await fetch(url, {
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error("Servidor indisponível");
        }

        return await response.json();

    } finally {
        clearTimeout(timer);
    }
}

async function fetchChannelVideos(creator, page = 1) {

    const errors = [];

    for (let i = 0; i < instances.length; i++) {

        const index = (currentInstanceIndex + i) % instances.length;
        const instance = instances[index];

        try {

            const url =
                `${instance}/api/v1/channels/${creator.id}/videos` +
                `?sort_by=newest&page=${page}`;

            const data = await fetchWithTimeout(url);

            if (!Array.isArray(data)) {
                throw new Error("Formato de resposta inválido");
            }

            currentInstanceIndex = index;

            return data.map(video => ({
                id: video.videoId,
                title: video.title || "Vídeo sem título",
                author: creator.name,
                creator: creator,
                views: video.viewCount || 0,
                published: video.publishedText || "",
                thumbnail:
                    video.videoThumbnails?.find(
                        image => image.quality === "high"
                    )?.url ||
                    `https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg`
            }));

        } catch (error) {
            errors.push(error.message);
        }
    }

    throw new Error("Não foi possível acessar as instâncias públicas.");
}

/* ==========================================
   CARREGAMENTO INICIAL
========================================== */

async function loadHomeFeed() {

    if (loading) return;

    loading = true;
    statusText.textContent = "Buscando vídeos dos canais...";
    videoGrid.innerHTML = "";

    const results = await Promise.allSettled(
        creators.map(creator => fetchChannelVideos(creator, 1))
    );

    allVideos = [];

    results.forEach((result, index) => {

        if (result.status === "fulfilled") {
            allVideos.push(...result.value);
        } else {
            console.warn(
                "Falha ao carregar " + creators[index].name,
                result.reason
            );
        }
    });

    allVideos.sort((a, b) => {
        return b.views - a.views;
    });

    loading = false;

    renderFilters();
    renderHomeFeed();

    const failed = results.filter(
        result => result.status === "rejected"
    ).length;

    if (allVideos.length === 0) {
        statusText.textContent =
            "Não foi possível carregar os vídeos agora. " +
            "As instâncias públicas podem estar indisponíveis. " +
            "Tente novamente mais tarde.";
    } else if (failed > 0) {
        statusText.textContent =
            "Alguns canais não responderam. Os vídeos disponíveis foram carregados.";
    } else {
        statusText.textContent =
            "Todos os canais foram consultados.";
    }
}

/* ==========================================
   FILTROS
========================================== */

function renderFilters() {

    const container = document.getElementById("filters");

    const categories = [
        "Todos",
        ...creators.map(creator => creator.name)
    ];

    container.innerHTML = "";

    categories.forEach(category => {

        const button = document.createElement("button");
        button.className =
            "filter" + (currentFilter === category ? " active" : "");

        button.textContent = category;

        button.addEventListener("click", () => {
            currentFilter = category;
            homePage = 1;
            renderFilters();
            renderHomeFeed();
        });

        container.appendChild(button);
    });
}

/* ==========================================
   CARDS DE VÍDEOS
========================================== */

function createVideoCard(video) {

    const card = document.createElement("article");
    card.className = "video-card";

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";

    const image = document.createElement("img");
    image.src = video.thumbnail;
    image.alt = video.title;
    image.loading = "lazy";

    image.onerror = () => {
        image.src =
            `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
    };

    const play = document.createElement("div");
    play.className = "play-icon";
    play.textContent = "▶";

    thumbnail.append(image, play);

    const info = document.createElement("div");
    info.className = "video-info";

    const avatar = document.createElement("div");
    avatar.className = "video-avatar";
    avatar.textContent = video.creator.initials;

    const details = document.createElement("div");

    const title = document.createElement("div");
    title.className = "video-title";

    // Exibe o título recebido do canal.
    title.textContent = video.title;

    const meta = document.createElement("div");
    meta.className = "video-meta";

    meta.textContent =
        `${video.author} · ${formatViews(video.views)} visualizações`;

    details.append(title, meta);
    info.append(avatar, details);

    card.append(thumbnail, info);

    card.addEventListener("click", () => playVideo(video));

    return card;
}

function formatViews(number) {

    if (!number) return "Visualizações indisponíveis";

    return new Intl.NumberFormat("pt-BR", {
        notation: "compact",
        maximumFractionDigits: 1
    }).format(number);
}

/* ==========================================
   FEED PRINCIPAL
========================================== */

function renderHomeFeed() {

    videoGrid.innerHTML = "";

    let filtered = [...allVideos];

    if (currentFilter !== "Todos") {
        filtered = filtered.filter(
            video => video.author === currentFilter
        );
    }

    const search = searchInput.value.trim().toLowerCase();

    if (search) {
        filtered = filtered.filter(video =>
            video.title.toLowerCase().includes(search) ||
            video.author.toLowerCase().includes(search)
        );
    }

    const pageSize = 24;
    const visible = filtered.slice(0, homePage * pageSize);

    visible.forEach(video => {
        videoGrid.appendChild(createVideoCard(video));
    });

    document.getElementById("videoCount").textContent =
        `${filtered.length} vídeos encontrados`;

    document.getElementById("loadMore").classList.toggle(
        "hidden",
        visible.length >= filtered.length
    );

    if (filtered.length === 0 && allVideos.length > 0) {
        videoGrid.innerHTML =
            `<div class="empty">Nenhum vídeo encontrado para essa pesquisa.</div>`;
    }
}

/* ==========================================
   PÁGINA DO CANAL
========================================== */

async function openChannel(creator) {

    currentCreator = creator;
    channelPageNumber = 1;
    currentChannelVideos = [];

    document.getElementById("homePage").classList.add("hidden");
    document.getElementById("channelPage").classList.remove("hidden");

    document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.remove("active");
    });

    const header = document.getElementById("channelHeader");

    header.innerHTML = `
        <div class="channel-header">
            <div class="creator-avatar">${creator.initials}</div>
            <div>
                <h2>${creator.name}</h2>
                <p>${creator.handle} · ${creator.category}</p>
            </div>
            <a class="channel-link"
               href="https://www.youtube.com/${creator.handle}"
               target="_blank" rel="noopener">
                Abrir canal ↗
            </a>
        </div>
    `;

    document.getElementById("channelGrid").innerHTML = "";
    document.getElementById("channelStatus").textContent =
        "Carregando vídeos...";

    document.getElementById("channelLoadMore").classList.add("hidden");

    await refreshChannel();
}

async function refreshChannel() {

    const grid = document.getElementById("channelGrid");
    const status = document.getElementById("channelStatus");

    try {

        const videos = await fetchChannelVideos(
            currentCreator,
            channelPageNumber
        );

        currentChannelVideos.push(...videos);

        videos.forEach(video => {
            grid.appendChild(createVideoCard(video));
        });

        status.textContent =
            `${currentChannelVideos.length} vídeos carregados.`;

        document.getElementById("channelLoadMore").classList.toggle(
            "hidden",
            videos.length === 0
        );

    } catch (error) {

        status.textContent =
            "Não foi possível carregar este canal agora. " +
            "Você ainda pode abrir o canal diretamente pelo botão acima.";

        document.getElementById("channelLoadMore").classList.add("hidden");
    }
}

/* ==========================================
   PLAYER
========================================== */

function playVideo(video) {

    const modal = document.getElementById("playerModal");
    const frame = document.getElementById("playerFrame");

    document.getElementById("playerTitle").textContent = video.title;

    frame.src =
        `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0`;

    modal.classList.add("open");
}

function closePlayer() {

    document.getElementById("playerModal").classList.remove("open");
    document.getElementById("playerFrame").src = "";
}

document.getElementById("closePlayer").addEventListener(
    "click",
    closePlayer
);

document.getElementById("playerModal").addEventListener(
    "click",
    event => {
        if (event.target.id === "playerModal") {
            closePlayer();
        }
    }
);

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closePlayer();
});

/* ==========================================
   BUSCA
========================================== */

function searchVideos() {

    const home = document.getElementById("homePage");
    const channel = document.getElementById("channelPage");

    home.classList.remove("hidden");
    channel.classList.add("hidden");

    currentFilter = "Todos";
    homePage = 1;

    document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.page === "home"
        );
    });

    renderFilters();
    renderHomeFeed();
}

document.getElementById("searchButton").addEventListener(
    "click",
    searchVideos
);

searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") searchVideos();
});

searchInput.addEventListener("input", () => {
    if (!document.getElementById("homePage").classList.contains("hidden")) {
        homePage = 1;
        renderHomeFeed();
    }
});

/* ==========================================
   NAVEGAÇÃO
========================================== */

document.querySelectorAll(".nav-btn").forEach(button => {

    button.addEventListener("click", () => {

        const page = button.dataset.page;

        document.querySelectorAll(".nav-btn").forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");

        document.getElementById("homePage").classList.toggle(
            "hidden",
            page === "creators"
        );

        document.getElementById("channelPage").classList.add("hidden");

        if (page === "home" || page === "videos") {
            document.getElementById("homePage").classList.remove("hidden");

            if (page === "videos") {
                currentFilter = "Todos";
                homePage = 1;
                renderFilters();
                renderHomeFeed();
            }
        }

        if (page === "creators") {
            document.getElementById("homePage").classList.remove("hidden");
            document.getElementById("homeCreators").scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    });
});

/* ==========================================
   CARREGAR MAIS
========================================== */

document.getElementById("loadMore").addEventListener(
    "click",
    () => {
        homePage++;
        renderHomeFeed();
    }
);

document.getElementById("channelLoadMore").addEventListener(
    "click",
    async () => {
        channelPageNumber++;
        await refreshChannel();
    }
);

/* ==========================================
   INICIALIZAÇÃO
========================================== */

renderCreators();
renderFilters();
loadHomeFeed();

</script>
</body>
</html>
