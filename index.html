<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrBeast Portal - Vídeos & Shorts</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1f1f1f;
      --accent-color: #00e5ff;
      --text-color: #ffffff;
      --text-secondary: #aaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding-top: 10px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* Menu de Abas (Tabs) */
    .nav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .tab-button {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #333;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-button:hover {
      background-color: #2a2a2a;
    }

    .tab-button.active {
      background-color: var(--accent-color);
      color: #000;
      border-color: var(--accent-color);
    }

    /* Conteúdo das Abas */
    .tab-content {
      display: none;
      width: 100%;
      max-width: 1100px;
    }

    .tab-content.active {
      display: block;
    }

    /* Container do Player Principal (Vídeos Longos) */
    .main-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid #333;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Grade para os Shorts (Vertical 9:16) */
    .shorts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .short-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
    }

    .short-card h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: var(--text-color);
    }

    .short-wrapper {
      position: relative;
      width: 100%;
      padding-top: 177.77%; /* Proporção 9:16 (Vertical) */
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }

    .short-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .instructions {
      margin-top: 20px;
      background: #141414;
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>MrBeast Portal</h1>
    <p>Escolha entre os vídeos completos ou os Shorts mais virais</p>
  </header>

  <!-- Botões de Navegação -->
  <div class="nav-tabs">
    <button class="tab-button active" onclick="switchTab('videos')">🎬 Vídeos Longos</button>
    <button class="tab-button" onclick="switchTab('shorts')">📱 Shorts</button>
  </div>

  <!-- ABA 1: VÍDEOS LONGOS -->
  <div id="tab-videos" class="tab-content active">
    <div class="main-card">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube.com/embed?listType=playlist&list=UUX6OQ3DkcsbYNE6H8uQQuVA" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="instructions">
        <p>💡 Clique no ícone de <strong>Playlist</strong> (três linhas no canto superior direito do player) para escolher qualquer vídeo do canal.</p>
      </div>
    </div>
  </div>

  <!-- ABA 2: SHORTS -->
  <div id="tab-shorts" class="tab-content">
    <div class="shorts-grid">

      <!-- Short 1 -->
      <div class="short-card">
        <h3>World's Tallest Maze</h3>
        <div class="short-wrapper">
          <iframe src="https://www.youtube.com/embed/r7P1v2s8kX4" allowfullscreen></iframe>
        </div>
      </div>

      <!-- Short 2 -->
      <div class="short-card">
        <h3>$1,000,000 Hotel Room</h3>
        <div class="short-wrapper">
          <iframe src="https://www.youtube.com/embed/2uQ7nJ_0C5A" allowfullscreen></iframe>
        </div>
      </div>

      <!-- Short 3 -->
      <div class="short-card">
        <h3>I Survived 7 Days In A Cave</h3>
        <div class="short-wrapper">
          <iframe src="https://www.youtube-nocookie.com/embed/9bqk6ZUSZuA" allowfullscreen></iframe>
        </div>
      </div>

      <!-- Short 4 -->
      <div class="short-card">
        <h3>Laser Maze Challenge</h3>
        <div class="short-wrapper">
          <iframe src="https://www.youtube.com/embed/kX3nB4UpJHY" allowfullscreen></iframe>
        </div>
      </div>

    </div>
  </div>

  <!-- Lógica das Abas -->
  <script>
    function switchTab(tabName) {
      // Esconde todos os conteúdos
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });

      // Remove a classe ativa dos botões
      document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.remove('active');
      });

      // Ativa a aba selecionada
      document.getElementById('tab-' + tabName).classList.add('active');
      
      // Ativa o botão clicado
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
