<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu NAVEGADOR de Vídeos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .search-box {
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background-color: #ff0000;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: #cc0000; }
    .video-container {
      width: 100%;
      max-width: 800px;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
    }
    .responsive-video {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
    }
    .responsive-video iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 6px;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Assistir Vídeo por Link ou ID</h1>

  <div class="search-box">
    <input type="text" id="videoInput" placeholder="Cole o link do YouTube ou o ID do vídeo aqui...">
    <button onclick="carregarVideo()">Assistir</button>
  </div>

  <div class="video-container">
    <div class="responsive-video">
      <iframe id="player" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function carregarVideo() {
      const input = document.getElementById('videoInput').value.trim();
      let videoId = input;

      // Extrai o ID caso a pessoa cole o link completo do YouTube
      if (input.includes('v=')) {
        videoId = input.split('v=')[1].split('&')[0];
      } else if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      }

      if (videoId) {
        document.getElementById('player').src = "https://www.youtube-nocookie.com/embed/" + videoId;
      }
    }
  </script>

</body>
</html>
