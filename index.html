<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canal MrBeast</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #ff0000;
    }

    .video-container {
      width: 100%;
      max-width: 900px;
      background: #1f1f1f;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .responsive-iframe {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Proporção 16:9 */
    }

    .responsive-iframe iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Vídeos do Canal MrBeast</h1>

  <div class="video-container">
    <div class="responsive-iframe">
      <!-- O parâmetro 'list=UUX6OQ3DkcsbYNE6H8uQQuVA' carrega todos os envios do canal do MrBeast -->
      <iframe 
        src="https://www.youtube-nocookie.com/embed/videoseries?list=UUX6OQ3DkcsbYNE6H8uQQuVA" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
