<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrBeast Feed Infinito</title>
  <style>
    :root {
      --bg-dark: #0f0f0f;
      --card-bg: #1f1f1f;
      --accent-cyan: #00e5ff;
      --text-main: #ffffff;
      --text-sub: #aaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Topo Fixo */
    header {
      background: #141414;
      width: 100%;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-cyan);
      letter-spacing: 1px;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
    }

    .filter-btn {
      background: #252525;
      color: var(--text-main);
      border: 1px solid #3d3d3d;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    main {
      width: 100%;
      max-width: 1300px;
      padding: 20px;
    }

    /* Feed de Longos (Grade Horizontal 16:9) */
    .grid-longos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .card-longo {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #2a2a2a;
    }

    .wrapper-16-9 {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    /* Feed de Shorts (Grade Vertical 9:16) */
    .grid-shorts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card-short {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 8px;
      border: 1px solid #2a2a2a;
    }

    .wrapper-9-16 {
      position: relative;
      width: 100%;
      padding-top: 177.77%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Status do Carregamento Infinito */
    .loading-status {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      font-size: 1.1rem;
      width: 100%;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MRBEAST INFINITE</div>
    <div class="filter-buttons">
      <button id="btn-longos" class="filter-btn active" onclick="mudarModo('longos')">🎬 Vídeos Longos</button>
      <button id="btn-shorts" class="filter-btn" onclick="mudarModo('shorts')">📱 Shorts</button>
    </div>
  </header>

  <main>
    <!-- Container dos Vídeos Longos -->
    <div id="container-longos" class="grid-longos"></div>

    <!-- Container dos Shorts -->
    <div id="container-shorts" class="grid-shorts hidden"></div>

    <div id="loading" class="loading-status">Gerando mais vídeos...</div>
  </main>

  <script>
    // Lista de vídeos representativos para o gerador de feed
    const idsLongos = [
      'kX3nB4UpJHY', '0e3GPea1Tyg', '48h57PspBec', '9bqk6ZUSZuA',
      'fmf5yfiG4GA', '7ERb1ALu-f0', 'hx0tV2rIuX8', '0BJlL1628_k',
      'erQ_9J-975U', 'gD_V4n7f1E8', 'VP8fT4f-W2I', 'f3k_wF1V1u8'
    ];

    const idsShorts = [
      'r7P1v2s8kX4', '2uQ7nJ_0C5A', '9bqk6ZUSZuA', 'kX3nB4UpJHY',
      'Y4S0-K3uRms', 'l9V414nU-7U', 'f77mJ91B_A8', 'Z3Yf5bU8YwM'
    ];

    let modoAtual = 'longos';
    let carregando = false;

    // Função para sortear um item aleatório da lista
    function getRandomId(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    // Carrega mais vídeos no container ativo
    function carregarMaisVideos(quantidade = 6) {
      if (carregando) return;
      carregando = true;

      const loadingEl = document.getElementById('loading');
      loadingEl.innerText = "Gerando mais vídeos...";

      setTimeout(() => {
        if (modoAtual === 'longos') {
          const container = document.getElementById('container-longos');
          for (let i = 0; i < quantidade; i++) {
            const id = getRandomId(idsLongos);
            const card = document.createElement('div');
            card.className = 'card-longo';
            card.innerHTML = `
              <div class="wrapper-16-9">
                <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>
              </div>
            `;
            container.appendChild(card);
          }
        } else {
          const container = document.getElementById('container-shorts');
          for (let i = 0; i < quantidade; i++) {
            const id = getRandomId(idsShorts);
            const card = document.createElement('div');
            card.className = 'card-short';
            card.innerHTML = `
              <div class="wrapper-9-16">
                <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>
              </div>
            `;
            container.appendChild(card);
          }
        }
        carregando = false;
      }, 300);
    }

    // Alternar entre o feed de vídeos longos e shorts
    function mudarModo(novoModo) {
      if (modoAtual === novoModo) return;

      modoAtual = novoModo;

      const btnLongos = document.getElementById('btn-longos');
      const btnShorts = document.getElementById('btn-shorts');
      const containerLongos = document.getElementById('container-longos');
      const containerShorts = document.getElementById('container-shorts');

      if (novoModo === 'longos') {
        btnLongos.classList.add('active');
        btnShorts.classList.remove('active');
        containerLongos.classList.remove('hidden');
        containerShorts.classList.add('hidden');
        if (containerLongos.children.length === 0) carregarMaisVideos(6);
      } else {
        btnShorts.classList.add('active');
        btnLongos.classList.remove('active');
        containerShorts.classList.remove('hidden');
        containerLongos.classList.add('hidden');
        if (containerShorts.children.length === 0) carregarMaisVideos(6);
      }
    }

    // Detector de rolagem da página (Infinite Scroll)
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        carregarMaisVideos(4);
      }
    });

    // Carregamento inicial
    carregarMaisVideos(6);
  </script>

</body>
</html>
