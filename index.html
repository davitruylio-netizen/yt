<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrBeast Hub - Todos os Vídeos</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1f1f1f;
      --accent-color: #00e5ff;
      --text-color: #ffffff;
      --text-secondary: #aaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .main-container {
      width: 100%;
      max-width: 1100px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid #333;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .instructions {
      margin-top: 20px;
      background: #141414;
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .instructions strong {
      color: var(--text-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>MrBeast Channel Portal</h1>
    <p>Todos os vídeos do canal reunidos em um só lugar</p>
  </header>

  <div class="main-container">
    <div class="video-wrapper">
      <!-- Player configurado com a playlist de envios do MrBeast -->
      <iframe 
        src="https://www.youtube.com/embed?listType=playlist&list=UUX6OQ3DkcsbYNE6H8uQQuVA" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="instructions">
      <p>💡 <strong>Como navegar por todos os vídeos:</strong> Clique no ícone de <em>Playlist</em> (três linhas com um triângulo no canto superior direito do próprio player) para abrir o catálogo completo de vídeos e escolher qualquer um para assistir.</p>
    </div>
  </div>

</body>
</html>
