<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrBeast Hub</title>
  <style>
    :root {
      --bg-dark: #0f0f0f;
      --card-bg: #1f1f1f;
      --accent-cyan: #00e5ff;
      --accent-red: #ff0000;
      --text-main: #ffffff;
      --text-sub: #aaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Cabeçalho Fixado */
    header {
      background: #141414;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Navegação por Filtros */
    .filter-buttons {
      display: flex;
      gap: 12px;
    }

    .filter-btn {
      background: #252525;
      color: var(--text-main);
      border: 1px solid #3d3d3d;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: #333333;
    }

    .filter-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    /* Área Principal de Conteúdo */
    main {
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Painéis de Conteúdo */
    .content-panel {
      display: none;
    }

    .content-panel.active {
      display: block;
    }

    /* Grade de Vídeos Longos (Horizontal 16:9) */
    .grid-longos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 25px;
    }

    .card-longo {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2a2a2a;
    }

    .card-longo h3 {
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .wrapper-16-9 {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .wrapper-16-9 iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Grade de Shorts (Vertical 9:16) */
    .grid-shorts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card-short {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #2a2a2a;
    }

    .card-short h3 {
      font-size: 0.9rem;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wrapper-9-16 {
      position: relative;
      width: 100%;
      padding-top: 177.77%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .wrapper-9-16 iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MRBEAST PORTAL</div>
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="filtrar('longos')">🎬 Vídeos Longos</button>
      <button class="filter-btn" onclick="filtrar('shorts')">📱 Shorts</button>
    </div>
  </header>

  <main>
    <!-- PAINEL 1: VÍDEOS LONGOS -->
    <section id="panel-longos" class="content-panel active">
      <h2 class="section-title">🎬 Vídeos Longos (Desafios Completos)</h2>
      <div class="grid-longos">
        
        <div class="card-longo">
          <h3>$1 vs $500,000 Plane Ticket!</h3>
          <div class="wrapper-16-9">
            <iframe src="https://www.youtube.com/embed/kX3nB4UpJHY" allowfullscreen></iframe>
          </div>
        </div>

        <div class="card-longo">
          <h3>7 Days Stranded At Sea</h3>
          <div class="wrapper-16-9">
            <iframe src="https://www.youtube.com/embed/0e3GPea1Tyg" allowfullscreen></iframe>
          </div>
        </div>

        <div class="card-longo">
          <h3>$1 vs $1,000,000 Hotel Room!</h3>
          <div class="wrapper-16-9">
            <iframe src="https://www.youtube.com/embed/48h57PspBec" allowfullscreen></iframe>
          </div>
        </div>

        <div class="card-longo">
          <h3>7 Days Stranded In A Cave</h3>
          <div class="wrapper-16-9">
            <iframe src="https://www.youtube.com/embed/9bqk6ZUSZuA" allowfullscreen></iframe>
          </div>
        </div>

      </div>
    </section>

    <!-- PAINEL 2: SHORTS -->
    <section id="panel-shorts" class="content-panel">
      <h2 class="section-title">📱 Shorts Virais</h2>
      <div class="grid-shorts">
        
        <div class="card-short">
          <h3>World's Tallest Maze</h3>
          <div class="wrapper-9-16">
            <iframe src="https://www.youtube.com/embed/r7P1v2s8kX4" allowfullscreen></iframe>
          </div>
        </div>

        <div class="card-short">
          <h3>$1,000,000 Hotel Room</h3>
          <div class="wrapper-9-16">
            <iframe src="https://www.youtube.com/embed/2uQ7nJ_0C5A" allowfullscreen></iframe>
          </div>
        </div>

        <div class="card-short">
          <h3>I Survived 7 Days In A Cave</h3>
          <div class="wrapper-9-16">
            <iframe src="https://www.youtube.com/embed/9bqk6ZUSZuA" allowfullscreen></iframe>
          </div>
        </div>

        <div class="card-short">
          <h3>Laser Maze Challenge</h3>
          <div class="wrapper-9-16">
            <iframe src="https://www.youtube.com/embed/kX3nB4UpJHY" allowfullscreen></iframe>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    function filtrar(tipo) {
      // Oculta todos os painéis
      document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
      
      // Desativa os botões
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      
      // Ativa o painel selecionado
      document.getElementById('panel-' + tipo).classList.add('active');
      
      // Ativa o botão correspondente
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
